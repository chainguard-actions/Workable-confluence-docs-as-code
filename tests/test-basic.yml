name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          confluence_tenant: test-tenant
          confluence_space: TESTSPACE
          confluence_user: test@example.com
          confluence_token: fake-token-for-testing
          confluence_parent_page: "Documentation"
          confluence_title_prefix: "[TEST] "
          confluence_force_update: "no"
          confluence_cleanup: "no"
          kroki_enabled: "yes"
      - name: Assert action ran (expected to fail due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
