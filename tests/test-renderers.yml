name: Test renderer options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          confluence_tenant: test-tenant
          confluence_space: TESTSPACE
          confluence_user: test@example.com
          confluence_token: fake-token-for-testing
          mermaid_renderer: kroki
          plantuml_renderer: kroki
          kroki_enabled: "yes"
          kroki_host: "https://kroki.io"
      - name: Assert action ran (expected to fail due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
